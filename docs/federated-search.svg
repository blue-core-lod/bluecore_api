<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="ttl desc">
  <title id="ttl">Finding a record to copy, without loading the Library of Congress</title>
  <desc id="desc">A cataloger searches from Sinopia Editor. The Blue Core API queries its own index and
  id.loc.gov at the same time, and returns results grouped by source. Copying a Library of Congress
  record fetches it through the API, which reshapes it but stores nothing. The record becomes a Blue
  Core row only when the cataloger saves it.</desc>

  <defs>
    <marker id="hd-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="hd-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b4e9e"/>
    </marker>
    <marker id="hd-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
    </marker>
    <marker id="hd-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b54708"/>
    </marker>
  </defs>

  <rect width="1000" height="800" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="44" font-size="21" font-weight="600" fill="#1f2933">Finding a record to copy, without loading the Library of Congress</text>
  <text x="40" y="70" font-size="13.5" fill="#616e7c">Blue Core searches id.loc.gov live. A record becomes a Blue Core row only when a cataloger saves it.</text>

  <!-- actors -->
  <rect x="55" y="96" width="190" height="44" rx="6" fill="#eef2f7" stroke="#cbd2d9"/>
  <text x="150" y="117" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Sinopia Editor</text>
  <text x="150" y="133" font-size="11" fill="#616e7c" text-anchor="middle">the cataloger</text>

  <rect x="405" y="96" width="190" height="44" rx="6" fill="#e3edf8" stroke="#a9c5e3"/>
  <text x="500" y="117" font-size="13" font-weight="600" fill="#1a4f86" text-anchor="middle">Blue Core API</text>
  <text x="500" y="133" font-size="11" fill="#2b6cb0" text-anchor="middle">and its own index</text>

  <rect x="755" y="96" width="190" height="44" rx="6" fill="#f0ecf7" stroke="#c4b5dd"/>
  <text x="850" y="117" font-size="13" font-weight="600" fill="#4c3a73" text-anchor="middle">id.loc.gov</text>
  <text x="850" y="133" font-size="11" fill="#6b4e9e" text-anchor="middle">about 50 million records</text>

  <!-- lifelines -->
  <line x1="150" y1="140" x2="150" y2="684" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line x1="500" y1="140" x2="500" y2="684" stroke="#a9c5e3" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line x1="850" y1="140" x2="850" y2="684" stroke="#c4b5dd" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- ===== phase 1: search ===== -->
  <rect x="40" y="158" width="920" height="196" rx="8" fill="#f6f9fc"/>
  <text x="56" y="179" font-size="11.5" font-weight="600" fill="#7b8794" letter-spacing="0.8">SEARCH</text>

  <text x="321" y="205" font-size="12" fill="#1f2933" text-anchor="middle">1 &#8194;search &#8220;melville moby dick&#8221;</text>
  <line x1="150" y1="212" x2="492" y2="212" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#hd-blue)"/>

  <text x="671" y="239" font-size="12" fill="#1f2933" text-anchor="middle">2 &#8194;ask for works, instances and hubs</text>
  <line x1="500" y1="246" x2="842" y2="246" stroke="#6b4e9e" stroke-width="1.8" marker-end="url(#hd-purple)"/>

  <path d="M500,268 h40 a9,9 0 0 1 9,9 v6 a9,9 0 0 1 -9,9 h-32" fill="none" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#hd-blue)"/>
  <text x="562" y="288" font-size="11.5" fill="#2b6cb0">and its own index, at the same time</text>

  <text x="700" y="311" font-size="11.5" fill="#616e7c" text-anchor="middle">about a second</text>
  <line x1="850" y1="318" x2="512" y2="318" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#hd-grey)"/>

  <text x="329" y="339" font-size="12" fill="#1f2933" text-anchor="middle">3 &#8194;results grouped by source, each ranked on its own</text>
  <line x1="500" y1="346" x2="158" y2="346" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#hd-blue)"/>

  <!-- ===== phase 2: copy ===== -->
  <rect x="40" y="370" width="920" height="196" rx="8" fill="#faf8fd"/>
  <text x="56" y="391" font-size="11.5" font-weight="600" fill="#7b8794" letter-spacing="0.8">COPY</text>

  <text x="321" y="417" font-size="12" fill="#1f2933" text-anchor="middle">4 &#8194;cataloger picks a Library of Congress record</text>
  <line x1="150" y1="424" x2="492" y2="424" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#hd-blue)"/>

  <text x="671" y="451" font-size="12" fill="#1f2933" text-anchor="middle">5 &#8194;fetch that one record</text>
  <line x1="500" y1="458" x2="842" y2="458" stroke="#6b4e9e" stroke-width="1.8" marker-end="url(#hd-purple)"/>

  <text x="681" y="483" font-size="11.5" fill="#616e7c" text-anchor="middle">the record as LC publishes it</text>
  <line x1="850" y1="490" x2="512" y2="490" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#hd-grey)"/>

  <text x="329" y="513" font-size="12" fill="#1f2933" text-anchor="middle">6 &#8194;reshaped into Blue Core&#8217;s own form, opened for editing</text>
  <line x1="500" y1="520" x2="158" y2="520" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#hd-blue)"/>

  <text x="500" y="548" font-size="12" font-style="italic" fill="#4c3a73" text-anchor="middle">Nothing has been written to Blue Core yet &#8212; walk away and it is unchanged.</text>

  <!-- ===== phase 3: save ===== -->
  <rect x="40" y="582" width="920" height="100" rx="8" fill="#fdf5ec"/>
  <text x="56" y="603" font-size="11.5" font-weight="600" fill="#8a5300" letter-spacing="0.8">SAVE &#8212; the first and only write</text>

  <text x="321" y="633" font-size="12.5" font-weight="600" fill="#8a5300" text-anchor="middle">7 &#8194;cataloger saves</text>
  <line x1="150" y1="641" x2="492" y2="641" stroke="#b54708" stroke-width="3" marker-end="url(#hd-amber)"/>

  <rect x="516" y="621" width="252" height="40" rx="6" fill="#ffffff" stroke="#e0a370"/>
  <text x="532" y="646" font-size="12" fill="#8a5300">a Blue Core record is created</text>

  <!-- ===== the contrast ===== -->
  <line x1="40" y1="708" x2="960" y2="708" stroke="#e4e7eb"/>
  <text x="40" y="734" font-size="13" font-weight="600" fill="#1f2933">Why this, rather than loading it all</text>
  <text x="40" y="755" font-size="12" fill="#3e4c59">Blue Core holds the records catalogers actually keep &#8212; not the 49.8 million they might search.</text>
  <text x="40" y="774" font-size="11.5" fill="#616e7c">Loading everything measures out at roughly 610&#160;GB, and the Library of Congress publishes no bulk export of works or instances to load.</text>
</svg>
