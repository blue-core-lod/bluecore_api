[project]
name = "bluecore-api"
version = "0.25.0"
description = "Blue Core API for managing BIBFRAME RDF data and workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bluecore-models>=0.25.0",
  "fastapi[standard]",
  "sqlalchemy",
  "pgvector",
  "psycopg2-binary>=2.9.10",
  "rdflib>=7.1.3",
  "python-multipart>=0.0.20",
  "fastapi-keycloak-middleware>=1.2.0",
  "typer>=0.15.4",
  "python-dotenv>=1.1.0",
  "fastapi-mcp>=0.4.0",
  "lxml>=6.0.2",
  "jinja2>=3.1.6",
  "pymarc>=5.2.0",
  "mcp==1.29.0" # Pinning version until fastapi-mcp is updated
]

[project.scripts]
bluecore = "bluecore_api.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.11.6",
  "pytest>=8.3.4",
  "pytest-mock-resources[docker]>=2.12.1",
  "pytest-mock>=3.14.0",
  "pytest-httpx>=0.35.0",
  "pytest-asyncio>=0.26.0",
  "lxml-stubs>=0.5.1",
  "types-lxml>=2026.2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bluecore_api"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern relies on calling these in argument
# defaults, so they're not the mutable-default footgun B008 warns about.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "bluecore_api.app.utils.deserializer.deserialize",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures/assertions do blocking file I/O inside async-marked tests;
# there's no event loop contention to worry about here.
"tests/**" = ["ASYNC230"]

[tool.ruff.lint]
ignore = [
  "B008",    # FastAPI requires Depends/File calls in function-parameter defaults
  "ASYNC240", # os.path ops in async are fast metadata calls, not blocking I/O
]
