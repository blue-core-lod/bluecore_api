name: Weekly Dependency Updates

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM UTC
  workflow_dispatch: # Enables the "Run workflow" button in GitHub

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Update dependencies
        run: uv lock --upgrade

      # keycloak-js loads from jsDelivr via the import map in _fields.html, so
      # uv never sees it. Bump it within KEYCLOAK_JS_MAJOR and recompute the
      # integrity hash, or the browser refuses the new file. Raise the major
      # only alongside a Keycloak server major upgrade in bluecore-stack.
      - name: Update keycloak-js pin
        env:
          KEYCLOAK_JS_MAJOR: 26
          TEMPLATE: src/bluecore_api/app/views/templates/_fields.html
        run: |
          set -euo pipefail
          current=$(grep -oP 'keycloak-js@\K[0-9]+\.[0-9]+\.[0-9]+' "$TEMPLATE")
          registry=$(curl -fsS https://registry.npmjs.org/keycloak-js)
          latest=$(echo "$registry" \
            | jq -r --arg major "$KEYCLOAK_JS_MAJOR" '.versions | keys[] | select(test("^" + $major + "\\.[0-9]+\\.[0-9]+$"))' \
            | sort -V | tail -1)
          if [ "$current" = "$latest" ]; then
            echo "keycloak-js $current is current"
            exit 0
          fi

          # Hash the file from the npm tarball, checked against the registry's
          # sha512, then confirm jsDelivr serves the same bytes.
          workdir=$(mktemp -d)
          tarball=$(echo "$registry" | jq -r --arg v "$latest" '.versions[$v].dist.tarball')
          expected=$(echo "$registry" | jq -r --arg v "$latest" '.versions[$v].dist.integrity')
          curl -fsS "$tarball" -o "$workdir/pkg.tgz"
          actual="sha512-$(openssl dgst -sha512 -binary "$workdir/pkg.tgz" | base64 -w0)"
          [ "$actual" = "$expected" ] || { echo "tarball integrity mismatch"; exit 1; }
          tar xzf "$workdir/pkg.tgz" -C "$workdir" package/lib/keycloak.js
          sri="sha384-$(openssl dgst -sha384 -binary "$workdir/package/lib/keycloak.js" | base64 -w0)"
          cdn="sha384-$(curl -fsSL "https://cdn.jsdelivr.net/npm/keycloak-js@$latest/lib/keycloak.js" | openssl dgst -sha384 -binary | base64 -w0)"
          [ "$sri" = "$cdn" ] || { echo "jsDelivr bytes differ from npm"; exit 1; }

          sed -i -E \
            -e "s|keycloak-js@[0-9]+\.[0-9]+\.[0-9]+/lib/keycloak\.js|keycloak-js@$latest/lib/keycloak.js|" \
            -e "s|keycloak_js_integrity = \"[^\"]*\"|keycloak_js_integrity = \"$sri\"|" \
            "$TEMPLATE"
          echo "keycloak-js $current -> $latest"

      - name: Check for dependency changes
        id: check_changes
        run: |
          if git diff --quiet uv.lock src/bluecore_api/app/views/templates/_fields.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check_changes.outputs.changed == 'true'
        run: uv sync

      - name: Run tests
        if: steps.check_changes.outputs.changed == 'true'
        run: uv run pytest

      - name: Bump patch version
        id: bump_version
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          NEW_VERSION=$(python3 -c "
          import re
          with open('pyproject.toml') as f:
              content = f.read()
          m = re.search(r'version = \"(\d+)\.(\d+)\.(\d+)\"', content)
          major, minor, patch = m.groups()
          print(f'{major}.{minor}.{int(patch) + 1}')
          ")
          sed -i "s/^version = \"[0-9]*\.[0-9]*\.[0-9]*\"/version = \"$NEW_VERSION\"/" pyproject.toml
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Sync lockfile with bumped version
        if: steps.check_changes.outputs.changed == 'true'
        run: uv lock

      - name: Create Pull Request
        id: create_pr
        if: steps.check_changes.outputs.changed == 'true' && success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: dependency-updates
          base: main
          title: 'Weekly dependency updates (${{ steps.bump_version.outputs.new_version }})'
          body: |
            Weekly automated dependency updates.

            - Updated `uv.lock` via `uv lock --upgrade`
            - Updated the keycloak-js pin and integrity hash in `_fields.html`, if a newer release exists
            - Bumped patch version to `${{ steps.bump_version.outputs.new_version }}`
          commit-message: 'Update dependencies and bump patch version to ${{ steps.bump_version.outputs.new_version }}'
          labels: dependencies

      - name: Notify Slack
        if: steps.check_changes.outputs.changed == 'true' && success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_URL: ${{ steps.create_pr.outputs.pull-request-url }}
          NEW_VERSION: ${{ steps.bump_version.outputs.new_version }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"${REPO_NAME} dependency update PR opened: <$PR_URL|v$NEW_VERSION>\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Notify Slack on test failure
        if: steps.check_changes.outputs.changed == 'true' && failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"$REPO_NAME dependency update failed: <$RUN_URL|view run>\"}" \
            "$SLACK_WEBHOOK_URL"
